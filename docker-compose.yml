version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: syncboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  syncboard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncboard-app
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/syncboard
      JWT_SECRET: syncboard_super_production_secret_key_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
